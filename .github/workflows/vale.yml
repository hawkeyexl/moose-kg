name: Vale

# Prose lint against the Moose house voice (Voices + Direct). Blocking: the
# corpus was worked down to zero alerts, so any new one is a regression rather
# than a backlog item.
#
# filter_mode is `nofilter` on purpose. `added` would hold only the lines a pull
# request writes, which is what an unworked corpus needs; with the corpus clean,
# the whole of it is the baseline and a finding anywhere fails. That also catches
# a change that moves an existing sentence past 25 words without touching it,
# which a diff-scoped filter reads as untouched.
#
# test/fixtures/ is exempt in .vale.ini, not here: its bytes are the test.
#
# The reporter has to suit the event. github-pr-review posts inline review
# comments and needs a pull request to hang them on, which the push and
# workflow_dispatch triggers do not have. Those report through github-check,
# which reviewdog documents as working for a commit as well as a pull request.
# fail_on_error is what makes the gate bite, either way.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**.md"
      - "**.mdx"
      - "**.txt"
      - ".vale.ini"
      - ".github/workflows/vale.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vale-cli/vale-action@v3
        with:
          version: 3.20.0
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          filter_mode: nofilter
          fail_on_error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
