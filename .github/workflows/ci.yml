name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    # Byte-identical rebuilds are the product contract on every platform dockg
    # claims, so the suite and the determinism gate run on all three. Windows in
    # particular exercises what only Windows can break: the CRLF fixture pinned
    # by .gitattributes, path → IRI derivation, and the git-provenance
    # subprocess tests.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The determinism gate is a bash script (cmp, sed). GitHub ships bash on
        # every runner including Windows, so one script serves all three rather
        # than a PowerShell variant that would drift.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs the PR's commits, not just the tip.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # engines.npm is >=11.6.3 and .npmrc sets engine-strict, so a runner image
      # whose bundled npm is older fails `npm ci` with EBADENGINE and nothing in
      # the log explains why. The floor does not ride on the Node floor: Node
      # 24.11.0 satisfies >=24 and bundles npm 11.6.1. Pin it rather than hope.
      - name: Enforce the npm engines floor
        run: npm install -g npm@^11.6.3

      # `npm ci`, restored: the "platform-skewed lock" this used to work around
      # was a misdiagnosis (ADR 01040). The lock records all fourteen rolldown
      # bindings with their os/cpu, Linux included, and rolldown no longer ships
      # a wasm32-wasi binding at all — so the @emnapi/* peers it once reached are
      # not in the tree. The real variable was npm's own version: <=11.6.2
      # dropped those entries on every OS, and 11.6.3 keeps them on every OS.
      - run: npm ci

      # The husky commit-msg hook is the first line of defense, but it is
      # bypassable (--no-verify, the GitHub web editor, a clone that never ran
      # `npm install`). semantic-release derives every version bump from these
      # messages, so a malformed one silently mis-versions a release — this is
      # the backstop that makes the convention binding. Note this validates the
      # PR's individual commits; if a PR is ever squash-merged, the squashed
      # subject is the PR title, which this does not see.
      - name: Commit messages (conventional commits)
        # One platform is enough: commit messages do not vary by runner.
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Determinism gate: byte-identical output is the product contract.
      # (Golden comparison normalizes the dockg:version literal so release
      # version bumps don't invalidate it.)
      #
      # RUNNER_TEMP rather than /tmp: /tmp is not a path on a Windows runner.
      - name: Determinism gate
        working-directory: test/fixtures/corpus
        run: |
          node ../../../dist/cli.js build --out "$RUNNER_TEMP/gate-a.ttl"
          node ../../../dist/cli.js build --out "$RUNNER_TEMP/gate-b.ttl"
          cmp "$RUNNER_TEMP/gate-a.ttl" "$RUNNER_TEMP/gate-b.ttl"
          sed 's/dockg:version "[^"]*"/dockg:version "X"/' "$RUNNER_TEMP/gate-a.ttl" > "$RUNNER_TEMP/gate-a-norm.ttl"
          sed 's/dockg:version "[^"]*"/dockg:version "X"/' ../golden/graph.ttl > "$RUNNER_TEMP/golden-norm.ttl"
          cmp "$RUNNER_TEMP/gate-a-norm.ttl" "$RUNNER_TEMP/golden-norm.ttl"

      # Emit every artifact whose bytes are supposed to be platform-independent,
      # for the cross-platform job below to compare across runners.
      #
      # Every byte-exact golden CLAUDE.md names is represented here.
      # `metadata.rdf` is covered transitively: it is `META-INF/metadata.rdf`
      # inside package.iirds, whose zip entry timestamps are pinned to a fixed
      # epoch (src/core/zip.ts), so byte-identical archives imply a
      # byte-identical member.
      - name: Emit the comparable artifacts
        working-directory: test/fixtures/corpus
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          cli() { node ../../../dist/cli.js "$@"; }
          cli build --out "$RUNNER_TEMP/artifacts/graph.ttl"
          cli export -f jsonld -g "$RUNNER_TEMP/artifacts/graph.ttl" -o "$RUNNER_TEMP/artifacts/graph.jsonld"
          # `-o` is a directory here: the retrieval artifacts fan out per
          # locale (ADR 01038), so this writes one search.<lang>.json per
          # language plus localizations.json.
          cli export -f search -g "$RUNNER_TEMP/artifacts/graph.ttl" -o "$RUNNER_TEMP/artifacts"
          cli export -f iirds  -g "$RUNNER_TEMP/artifacts/graph.ttl" -o "$RUNNER_TEMP/artifacts/package.iirds"
          # A traversal trace is where a locale-sensitive sort or a path -> IRI
          # difference would surface, and it surfaces nowhere else — the same
          # invocation test/integration/traverse.test.ts uses for its golden.
          cli traverse https://example.com/kg/doc/docs/configuration.md \
            -g "$RUNNER_TEMP/artifacts/graph.ttl" \
            -d 2 --predicates dcterms:references dcterms:hasPart \
            --variant SP-X100 -f json > "$RUNNER_TEMP/artifacts/traverse.json"
          # The mock model, so no weights are downloaded and the optional
          # @huggingface/transformers peer is not needed. Float layout in the
          # sidecar is exactly the kind of thing that could differ by platform.
          #
          # Must stay after the search export: `embed` reads the localization
          # manifest that export wrote, and without it exits 2 rather than
          # emitting. One sidecar per language, so `-o` is a directory too.
          cli embed -g "$RUNNER_TEMP/artifacts/graph.ttl" --model mock --no-cache \
            -i "$RUNNER_TEMP/artifacts" -o "$RUNNER_TEMP/artifacts"

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error

  # Three green per-OS golden checks prove three platforms each match one
  # golden. They do not prove the platforms match *each other* — a golden
  # regenerated on one OS would hide exactly that. This is the job that checks
  # it, and it is the actual claim the README makes.
  cross-platform:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: artifacts

      - name: Byte-identical across platforms
        run: |
          set -euo pipefail
          cd artifacts
          ls -1

          # Assert the inputs exist before comparing them. Without nullglob an
          # unmatched `artifacts-*/` leaves the literal pattern in $dir; the
          # sha256sum failure is swallowed because it sits in a command
          # substitution used as a printf argument, so every file reports one
          # distinct digest and the gate passes having compared nothing.
          platforms=$(find . -maxdepth 1 -type d -name 'artifacts-*' | wc -l)
          if [ "$platforms" -lt 2 ]; then
            echo "::error::expected one artifact directory per platform, found $platforms — nothing was compared"
            exit 1
          fi
          echo "comparing $platforms platforms"

          # Discovered from one platform's output rather than hardcoded, so a
          # language added to the corpus fixture joins this gate automatically.
          # A hardcoded list would keep passing while comparing one locale
          # fewer than the build actually produces — the retrieval artifacts
          # fan out per language now (ADR 01038).
          # Read into an array rather than piping to `head -1`: under
          # `set -o pipefail`, head closing the pipe can kill sort with SIGPIPE
          # and fail the whole step for a reason that has nothing to do with
          # the artifacts. Process substitution has no pipeline status at all.
          mapfile -t dirs < <(find . -maxdepth 1 -type d -name 'artifacts-*' | sort)
          reference=${dirs[0]}
          files=$(cd "$reference" && ls -1 | sort)
          echo "comparing files:"
          echo "$files"
          if [ "$(echo "$files" | wc -l)" -lt 6 ]; then
            echo "::error::fewer artifacts than the emit step should produce — nothing meaningful to compare"
            exit 1
          fi

          status=0
          for file in $files; do
            echo "--- $file"
            # One digest per platform. More than one distinct value means the
            # emitters disagree by platform, which the determinism contract
            # forbids.
            # Check the file exists before digesting it. `sha256sum` failing
            # inside a command substitution used as a printf argument does not
            # trip `set -e` — the same masking shape the comment above warns
            # about, one line lower. Today an upstream `bash -eo pipefail`
            # already fails the job if an emit step breaks, but that makes this
            # loop's safety depend on another step's shell options.
            digests=$(for dir in artifacts-*/; do
              if [ ! -f "$dir$file" ]; then
                echo "::error::$dir$file is missing — nothing to compare" >&2
                exit 1
              fi
              printf '%s  %s\n' "$(sha256sum "$dir$file" | cut -d' ' -f1)" "${dir%/}"
            done | sort) || exit 1
            echo "$digests"
            distinct=$(echo "$digests" | awk '{print $1}' | sort -u | wc -l)
            if [ "$distinct" -ne 1 ]; then
              echo "::error file=$file::$file differs across platforms ($distinct distinct digests)"
              status=1
            fi
          done
          exit $status

  # The embedder against the real model and a real browser (ADR 01025).
  #
  # Separate from build-test on purpose: this is the only job allowed network
  # beyond npm, and the only one that downloads model weights. `npm test` stays
  # hermetic. It exists because mocks certified a `createLocalEmbedder` that
  # threw on every real call for a whole release.
  embed-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Same engine floor as build-test: engines.npm is >=11.6.3 with
      # engine-strict, so a runner image below it fails `npm ci` with
      # EBADENGINE and nothing in the log says why.
      - name: Enforce the npm engines floor
        run: npm install -g npm@^11.6.3

      # `npm ci`, matching build-test. This job predates the switch back to it
      # (ADR 01040) and merged in still carrying `npm install`, which would have
      # left the two jobs installing differently — one against the lockfile, one
      # free to resolve around it.
      - run: npm ci

      # --save-dev, not a bare install: npm treats a plain
      # `npm install @huggingface/transformers` as already satisfied here,
      # because this package declares it as an *optional peer* of itself, and
      # installs its dependency tree without the package. Consumers, whose
      # manifests carry no such declaration, are unaffected.
      - name: Install the optional embedding peer
        run: npm install --save-dev @huggingface/transformers@^4

      # ~53 MB of granite weights. Keyed by model id so a default-model change
      # misses the cache rather than silently testing the old one.
      #
      # This is where transformers.js v4 actually caches in Node — verified by
      # reading `env.cacheDir` back, which resolves to
      # `node_modules/@huggingface/transformers/.cache/`. An earlier version of
      # this step cached `~/.cache/huggingface` (the Python HF path), which holds
      # nothing here, so it never saved or restored and re-downloaded every run.
      # Must come *after* the peer install, which creates the package directory.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-granite-embedding-small-english-r2-ONNX-q8-v2

      - run: npx playwright install --with-deps chromium

      # The cross-platform gate imports dist/embed.js — the built artifact a
      # consumer would import, not src.
      - run: npm run build

      - name: Real model, Node side
        run: npm run test:real

      # The guarantee dockg actually makes: a corpus embedded in Node and a
      # query embedded in the browser rank the same, even though the two run
      # different ONNX backends and cannot be made to run the same one.
      - name: Cross-platform ranking agreement
        run: npm run test:real:cross

  # `dockg fill` against a real OpenAI-compatible server (ADR 01031).
  #
  # Ollama, not a paid key: it maps response_format json_schema onto its native
  # format field, which llama-server compiles to a GBNF grammar — so the
  # structured-output mechanism OpenAICompatProvider depends on is genuinely
  # applied. Its Anthropic-compatible endpoint accepts tool_choice and never
  # reads it, so the same test there would be green and prove nothing; that path
  # stays a named exception in ADR 01026.
  fill-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@^11.6.3
      - run: npm ci

      # ~1.3 GB. A cold pull is 8-12 minutes and a restore is well under one,
      # so the cache is not optional. Keyed by model so changing it misses
      # rather than silently testing the old one.
      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-llama3.2-1b

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          # Backgrounding the server and pulling immediately races it, so poll
          # until it answers before going on.
          for _ in $(seq 1 60); do
            curl -sf http://localhost:11434/api/version >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:11434/api/version

      - run: ollama pull llama3.2:1b

      - run: npm run build
      - run: npm run test:real:fill
        env:
          OLLAMA_BASE_URL: http://localhost:11434/v1
          OLLAMA_MODEL: llama3.2:1b
          # Ollama ignores the value; the provider needs the variable to exist.
          OLLAMA_API_KEY: ollama
