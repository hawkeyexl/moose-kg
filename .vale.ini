# House voice for every document in this repo. The Moose package enables the
# Voices core, the Direct voice, and the Moose house rules for all Markdown
# and text files. README, ADRs, CLAUDE.md, DESIGN.md, the content strategy and
# the docs site are all held to the same voice.
# Package source: https://github.com/hawkeyexl/moose-vale
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/hawkeyexl/moose-vale/releases/latest/download/Moose.zip

# Vale parses .md natively but treats an unknown extension as plain text, and
# .mdx is unknown. Left alone it lints fenced code blocks, tables and headings
# as prose, so captured command output (which the docs are forbidden to
# hand-write) becomes an alert nobody may act on. Parse .mdx as Markdown.
[formats]
mdx = md

# MDX expression containers hold Doc Detective's test definitions, not prose:
# testIds, shell commands, and `stdio` strings that must match the CLI byte for
# byte. Parsed as Markdown they read as paragraphs, so skip the whole
# construct. They render to nothing, so no reader loses anything.
[*.mdx]
BlockIgnores = (?s)\{/\*.*?\*/\}

# The one exemption, and it is not an editorial one: test/fixtures/ holds the
# byte-exact inputs behind the goldens. Its bytes are the test. windows-notes.md
# is CRLF on purpose, `.prettierignore` keeps Prettier out for the same reason,
# and rewording a fixture invalidates every golden keyed to it. A prose rule
# cannot be satisfied here, so the gate does not ask.
[test/fixtures/**]
BasedOnStyles =
